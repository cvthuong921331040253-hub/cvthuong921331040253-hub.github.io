<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>Dashboard</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;
}


/* =====================================================
   BACKGROUND
===================================================== */

body{
  background:#f4f6f9;
}


/* =====================================================
   MAIN CONTENT
===================================================== */

.container{
  width:100vw;
  height:100vh;
  position:relative;
}

.content{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  background:#ffffff;
}


/* =====================================================
   IFRAME
===================================================== */

#frame{
  display:block;

  width:100%;
  height:100%;

  border:none;

  background:#ffffff;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{
  position:fixed;
  inset:0;

  z-index:1999;

  opacity:0;
  visibility:hidden;

  background:
    rgba(0,0,0,0.38);

  backdrop-filter:
    blur(3px);

  -webkit-backdrop-filter:
    blur(3px);

  transition:
    opacity 0.3s ease,
    visibility 0.3s ease;
}

.overlay.active{
  opacity:1;
  visibility:visible;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  position:fixed;

  top:0;
  left:0;

  width:280px;
  height:100vh;

  z-index:2000;

  overflow-y:auto;

  transform:
    translateX(-105%);

  transition:
    transform 0.35s
    cubic-bezier(
      0.22,
      1,
      0.36,
      1
    );

  background:
    linear-gradient(
      180deg,
      #1d2c3d 0%,
      #111c28 100%
    );

  border-right:
    1px solid
    rgba(255,255,255,0.08);

  box-shadow:
    15px 0 50px
    rgba(0,0,0,0.35);
}

.sidebar.active{
  transform:
    translateX(0);
}


/* =====================================================
   SCROLLBAR
===================================================== */

.sidebar::-webkit-scrollbar{
  width:5px;
}

.sidebar::-webkit-scrollbar-track{
  background:transparent;
}

.sidebar::-webkit-scrollbar-thumb{
  background:
    rgba(255,255,255,0.16);

  border-radius:10px;
}


/* =====================================================
   HEADER
===================================================== */

.sidebar-header{
  position:relative;

  height:127px;

  display:flex;
  align-items:center;

  padding:
    0 18px 0 96px;

  border-bottom:
    1px solid
    rgba(255,255,255,0.08);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.02),
      rgba(255,255,255,0)
    );
}


/* =====================================================
   LOGO TEXT
===================================================== */

.logo-text{
  display:flex;
  flex-direction:column;

  justify-content:center;
}

.logo-title{
  color:#ffffff;

  font-size:22px;

  font-weight:700;

  line-height:1.2;

  letter-spacing:
    0.3px;
}

.logo-subtitle{
  margin-top:5px;

  color:
    rgba(255,255,255,0.55);

  font-size:11px;

  font-weight:500;

  letter-spacing:
    1.6px;
}


/* =====================================================
   MENU TOGGLE
===================================================== */

.menu-toggle{
  position:fixed;

  top:35px;
  left:20px;

  width:58px;
  height:58px;

  z-index:3001;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:6px;

  padding:0;

  border:
    1px solid
    rgba(116,172,219,0.28);

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      #233548,
      #1b2b3b
    );

  box-shadow:
    0 10px 22px
    rgba(0,0,0,0.28),

    inset 0 1px 0
    rgba(255,255,255,0.05),

    0 0 18px
    rgba(0,174,239,0.14);

  cursor:pointer;

  transition:
    transform 0.2s ease,
    background 0.2s ease,
    border-color 0.2s ease;
}

.menu-toggle:hover{
  transform:scale(1.04);

  border-color:
    rgba(79,185,255,0.65);

  background:
    linear-gradient(
      145deg,
      #2a4258,
      #203548
    );
}


/* =====================================================
   MENU ICON LINES
===================================================== */

.menu-toggle span{
  display:block;

  width:23px;
  height:3px;

  border-radius:10px;

  background:#e7edf3;

  transition:
    transform 0.25s ease,
    opacity 0.2s ease;
}


/* =====================================================
   TOGGLE -> X
===================================================== */

.menu-toggle.active span:nth-child(1){
  transform:
    translateY(9px)
    rotate(45deg);
}

.menu-toggle.active span:nth-child(2){
  opacity:0;
}

.menu-toggle.active span:nth-child(3){
  transform:
    translateY(-9px)
    rotate(-45deg);
}


/* =====================================================
   MENU SECTION LABEL
===================================================== */

.menu-label{
  margin:
    20px 18px 10px;

  color:
    rgba(255,255,255,0.38);

  font-size:11px;

  font-weight:700;

  letter-spacing:
    1.2px;
}


/* =====================================================
   MENU ITEM
===================================================== */

.menu-item{
  display:flex;
  align-items:center;

  gap:13px;

  min-height:52px;

  margin:
    5px 12px;

  padding:
    11px 14px;

  border-radius:12px;

  color:
    rgba(255,255,255,0.82);

  font-size:14px;

  font-weight:500;

  cursor:pointer;

  user-select:none;

  transition:
    background 0.2s ease,
    transform 0.2s ease,
    color 0.2s ease;
}

.menu-item:hover{
  background:
    rgba(255,255,255,0.08);

  color:#ffffff;

  transform:
    translateX(4px);
}

.menu-item.active{
  color:#ffffff;

  background:
    linear-gradient(
      90deg,
      rgba(22,119,255,0.85),
      rgba(22,119,255,0.22)
    );

  box-shadow:
    inset
    3px 0 0
    #4aa3ff;
}


/* =====================================================
   MENU ICON
===================================================== */

.menu-icon{
  width:30px;
  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;

  border-radius:9px;

  background:
    rgba(255,255,255,0.06);

  font-size:16px;
}


/* =====================================================
   MENU TEXT
===================================================== */

.menu-text{
  flex:1;
}


/* =====================================================
   SIDEBAR FOOTER
===================================================== */

.sidebar-footer{
  margin:
    24px 12px 18px;

  padding:
    13px 10px;

  border:
    1px solid
    rgba(255,255,255,0.07);

  border-radius:12px;

  background:
    rgba(255,255,255,0.04);

  color:
    rgba(255,255,255,0.45);

  font-size:10px;

  text-align:center;

  letter-spacing:
    0.4px;
}

.status-dot{
  display:inline-block;

  width:7px;
  height:7px;

  margin-right:5px;

  border-radius:50%;

  background:#38d39f;

  box-shadow:
    0 0 10px
    rgba(56,211,159,0.8);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:768px){

  .sidebar{
    width:min(280px, 86vw);
  }

  .sidebar-header{
    height:110px;

    padding-left:88px;
  }

  .menu-toggle{
    top:26px;
    left:18px;

    width:54px;
    height:54px;

    border-radius:16px;
  }

  .logo-title{
    font-size:20px;
  }

  .menu-item{
    min-height:50px;
  }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:380px){

  .sidebar{
    width:88vw;
  }

  .sidebar-header{
    padding-left:82px;
  }

  .menu-toggle{
    left:14px;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     OVERLAY
===================================================== -->

<div
  class="overlay"
  id="overlay"
  onclick="closeMenu()"
></div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div
  class="sidebar"
  id="sidebar"
>


  <!-- HEADER -->

  <div class="sidebar-header">

    <div class="logo-text">

      <div class="logo-title">
        Dashboard
      </div>

      <div class="logo-subtitle">
        CONTROL CENTER
      </div>

    </div>

  </div>


  <!-- MENU -->

  <div class="menu-label">
    HỆ THỐNG BÁO CÁO
  </div>


  <div
    class="menu-item active"
    data-page="kpi"
    onclick="loadPage('kpi', this)"
  >
    <div class="menu-icon">📈</div>
    <div class="menu-text">KPI</div>
  </div>


  <div
    class="menu-item"
    data-page="toncdbr"
    onclick="loadPage('toncdbr', this)"
  >
    <div class="menu-icon">📊</div>
    <div class="menu-text">TỒN CĐBR</div>
  </div>


  <div
    class="menu-item"
    data-page="thuhoi"
    onclick="loadPage('thuhoi', this)"
  >
    <div class="menu-icon">📥</div>
    <div class="menu-text">Thu hồi</div>
  </div>


    <div
    class="menu-item"
    data-page="wotttd"
    onclick="loadPage('wotttd', this)"
  >
    <div class="menu-icon">⚙️</div>
    <div class="menu-text">WO TT TD</div>
  </div>

  <div
    class="menu-item"
    data-page="wifi"
    onclick="loadPage('wifi', this)"
  >
    <div class="menu-icon">📶</div>
    <div class="menu-text">Home Wifi</div>
  </div>


  <div
    class="menu-item"
    data-page="tietkiem"
    onclick="loadPage('tietkiem', this)"
  >
    <div class="menu-icon">💰</div>
    <div class="menu-text">Tiết kiệm VT</div>
  </div>


  <div
    class="menu-item"
    data-page="tonkho"
    onclick="loadPage('tonkho', this)"
  >
    <div class="menu-icon">📦</div>
    <div class="menu-text">Tồn kho CĐBR</div>
  </div>


  <div
    class="menu-item"
    data-page="icms"
    onclick="loadPage('icms', this)"
  >
    <div class="menu-icon">🗂️</div>
    <div class="menu-text">Tồn ICMS KSNN</div>
  </div>


  <!-- KÊNH TRUYỀN -->

  <div
    class="menu-item"
    data-page="kenhtruyen"
    onclick="loadPage('kenhtruyen', this)"
  >
    <div class="menu-icon">📡</div>
    <div class="menu-text">Kênh truyền</div>
  </div>


  <div
    class="menu-item"
    data-page="tammi"
    onclick="loadPage('tammi', this)"
  >
    <div class="menu-icon">⚙️</div>
    <div class="menu-text">TAMMI</div>
  </div>


  <!-- FOOTER -->

  <div class="sidebar-footer">

    <span class="status-dot"></span>

    HỆ THỐNG ĐANG HOẠT ĐỘNG

  </div>


</div>


<!-- =====================================================
     MENU BUTTON
===================================================== -->

<button
  class="menu-toggle"
  id="menuToggle"
  onclick="toggleMenu()"
  aria-label="Mở menu"
>
  <span></span>
  <span></span>
  <span></span>
</button>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<div class="container">

  <div class="content">

    <iframe
      id="frame"
      src="https://cvthuong921331040253-hub.github.io/dashboard-icms/"
      title="Dashboard"
    ></iframe>

  </div>

</div>


<script>

/* =====================================================
   DANH SÁCH TRANG
===================================================== */

const pages = {

  kpi:
  "https://cvthuong921331040253-hub.github.io/dashboard-icms/",

  toncdbr:
  "https://cvthuong921331040253-hub.github.io/dashboard-icms/toncdbr.html",

  thuhoi:
  "https://cvthuong921331040253-hub.github.io/dashboard-icms/thuhoi.html",

  wotttd:
  "https://cvthuong921331040253-hub.github.io/dashboard-icms/wotttd.html",
  
  wifi:
  "https://cvthuong921331040253-hub.github.io/dashboard-icms/homewifi.html",

  tietkiem:
  "https://cvthuong921331040253-hub.github.io/dashboard-icms/tietkiemvt.html",

  tonkho:
  "https://cvthuong921331040253-hub.github.io/dashboard-icms/tonkho.html",

  icms:
  "https://cvthuong921331040253-hub.github.io/dashboard-icms/icms.html",

  kenhtruyen:
  "https://cvthuong921331040253-hub.github.io/dashboard-icms/kenhtruyen.html",

  tammi:
  "https://cvthuong921331040253-hub.github.io/dashboard-icms/tammi.html"

};


/* =====================================================
   KHỞI TẠO
===================================================== */

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const menuToggle =
  document.getElementById("menuToggle");

const frame =
  document.getElementById("frame");


frame.dataset.currentPage =
  "kpi";


/* =====================================================
   LOAD PAGE
===================================================== */

function loadPage(page, element){

  const url = pages[page];

  if(!url){

    console.warn(
      "Không tìm thấy trang:",
      page
    );

    return;
  }


  /* Không reload nếu đang ở đúng trang */

  if(
    frame.dataset.currentPage !== page
  ){

    frame.src = url;

    frame.dataset.currentPage =
      page;

  }


  /* Xóa trạng thái active */

  document
    .querySelectorAll(".menu-item")
    .forEach(function(item){

      item.classList.remove(
        "active"
      );

    });


  /* Active menu hiện tại */

  if(element){

    element.classList.add(
      "active"
    );

  }


  /* Đóng menu */

  closeMenu();

}


/* =====================================================
   TOGGLE MENU
===================================================== */

function toggleMenu(){

  if(
    sidebar.classList.contains(
      "active"
    )
  ){

    closeMenu();

  }else{

    openMenu();

  }

}


/* =====================================================
   OPEN MENU
===================================================== */

function openMenu(){

  sidebar.classList.add(
    "active"
  );

  overlay.classList.add(
    "active"
  );

  menuToggle.classList.add(
    "active"
  );

}


/* =====================================================
   CLOSE MENU
===================================================== */

function closeMenu(){

  sidebar.classList.remove(
    "active"
  );

  overlay.classList.remove(
    "active"
  );

  menuToggle.classList.remove(
    "active"
  );

}


/* =====================================================
   ESC ĐỂ ĐÓNG MENU
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closeMenu();

    }

  }
);

</script>


</body>
</html>
